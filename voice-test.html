<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>數字語音辨識測試</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#111}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #d9dde5;border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 6px}.sub{color:#6b7280;font-size:14px}
button{min-height:48px;border:1px solid #cfd5df;border-radius:11px;background:#fff;padding:9px 14px;font-size:16px;font-weight:800}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.prompt{text-align:center;font-size:64px;font-weight:900;margin:12px 0}
.state{text-align:center;font-size:20px;font-weight:900;min-height:31px}
.raw{text-align:center;font-size:34px;font-weight:900;min-height:50px}
.num{text-align:center;font-size:48px;font-weight:900;min-height:64px}
.ok{color:#15803d}.bad{color:#b91c1c}.listen{color:#2563eb}
.meter{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0}
.meter>div{height:100%;width:0%;background:#111;border-radius:999px;transition:width .06s linear}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.test{padding:9px;border-radius:9px;border:1px solid #d9dde5;text-align:center;font-weight:800}
.test.pass{background:#dcfce7;border-color:#86efac}.test.fail{background:#fee2e2;border-color:#fca5a5}
.small{font-size:13px;color:#6b7280;line-height:1.5}
.log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#f8fafc;border-radius:9px;padding:10px;min-height:70px;max-height:150px;overflow:auto}
input{width:100%;min-height:46px;border:1px solid #cfd5df;border-radius:10px;padding:8px 10px;font-size:18px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.prompt{font-size:54px}.raw{font-size:28px}}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>數字語音辨識測試 <span style="font-size:12px;color:#6b7280">v1.0</span></h1>
    <div class="sub">先只測語音，不碰閃算主程式。</div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="start">開始測試</button>
      <button id="stop" disabled>停止</button>
      <button id="reset">重測</button>
    </div>
  </section>

  <section class="card">
    <div class="small">麥克風收音強度</div>
    <div class="meter"><div id="meter"></div></div>
    <div class="state" id="state">尚未開始</div>
  </section>

  <section class="card">
    <div class="small" style="text-align:center">請直接說</div>
    <div class="prompt" id="prompt">十二</div>
    <div class="small" style="text-align:center">原始辨識文字</div>
    <div class="raw" id="raw">—</div>
    <div class="small" style="text-align:center">轉成數字</div>
    <div class="num" id="num">—</div>
  </section>

  <section class="card">
    <div class="small">固定測試：每個數字說一次，辨識後會自動換下一個。</div>
    <div class="grid" id="tests"></div>
  </section>

  <section class="card">
    <div class="small">自由測試：可直接輸入想測的目標數字，再按「設為下一題」。</div>
    <div class="row" style="margin-top:8px">
      <input id="custom" inputmode="numeric" placeholder="例如 37">
      <button id="setCustom">設為下一題</button>
    </div>
  </section>

  <section class="card">
    <div class="small">錯誤／狀態紀錄</div>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cases=[12,18,25,37,46,58,72,105];
let idx=0,recognition=null,running=false,stream=null,audioCtx=null,analyser=null,raf=null;
let attempts=0,passes=0;

function log(msg){
  const t=new Date().toLocaleTimeString();
  $('#log').textContent+=`[${t}] ${msg}\n`;
  $('#log').scrollTop=$('#log').scrollHeight;
}
function renderTests(){
  $('#tests').innerHTML=cases.map((n,i)=>`<div class="test" id="t${i}">${n}</div>`).join('');
}
function setState(text,cls=''){
  $('#state').className='state '+cls;
  $('#state').textContent=text;
}
function current(){return cases[idx]}
function showPrompt(){
  $('#prompt').textContent=toZh(current());
  $('#raw').textContent='—';$('#raw').className='raw';
  $('#num').textContent='—';$('#num').className='num';
}
function toZh(n){
  const d=['零','一','二','三','四','五','六','七','八','九'];
  if(n<10)return d[n];
  if(n<20)return '十'+(n%10?d[n%10]:'');
  if(n<100)return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');
  if(n<1000){
    let h=Math.floor(n/100),r=n%100,s=d[h]+'百';
    if(!r)return s;
    if(r<10)return s+'零'+d[r];
    if(r<20)return s+'一十'+(r%10?d[r%10]:'');
    return s+d[Math.floor(r/10)]+'十'+(r%10?d[r%10]:'');
  }
  return String(n);
}
function parseNum(raw){
  if(!raw)return NaN;
  let s=String(raw).trim()
    .replace(/[，。！？,.!?\s]/g,'')
    .replace(/兩|两|貳|贰/g,'二')
    .replace(/壹/g,'一').replace(/參|叁/g,'三').replace(/肆/g,'四')
    .replace(/伍/g,'五').replace(/陸|陆/g,'六').replace(/柒/g,'七')
    .replace(/捌/g,'八').replace(/玖/g,'九').replace(/拾/g,'十')
    .replace(/佰/g,'百').replace(/仟/g,'千');
  const arab=s.match(/\d+/);
  if(arab)return Number(arab[0]);
  // keep only Chinese numeric chars
  s=(s.match(/[零〇○一二三四五六七八九十百千]+/g)||[]).join('');
  if(!s)return NaN;
  const d={'零':0,'〇':0,'○':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(!/[十百千]/.test(s)){
    const arr=[...s].map(x=>d[x]).filter(x=>x!==undefined);
    return arr.length?Number(arr.join('')):NaN;
  }
  let total=0,cur=0;
  for(const ch of s){
    if(d[ch]!==undefined){cur=d[ch];continue}
    const u=ch==='十'?10:ch==='百'?100:1000;
    total+=(cur||1)*u;cur=0;
  }
  return total+cur;
}
async function setupMic(){
  if(stream)return;
  stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false
  });
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  src.connect(analyser);
  const data=new Uint8Array(analyser.fftSize);
  const draw=()=>{
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for(const v of data){const x=(v-128)/128;sum+=x*x}
    const r=Math.sqrt(sum/data.length);
    $('#meter').style.width=Math.min(100,r*450)+'%';
    raf=requestAnimationFrame(draw);
  };
  draw();
}
function buildRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)throw new Error('這個瀏覽器沒有 SpeechRecognition');
  recognition=new SR();
  recognition.lang='zh-TW';
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=5;

  recognition.onstart=()=>{setState('🎧 正在聽…','listen');log('語音辨識開始')};
  recognition.onspeechstart=()=>setState('🎙️ 聽到聲音','listen');
  recognition.onresult=e=>{
    let finalText='',best='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const txt=e.results[i][0]?.transcript?.trim()||'';
      if(txt)best=txt;
      if(e.results[i].isFinal)finalText=txt;
    }
    const text=finalText||best;
    if(text){
      $('#raw').textContent=text;
      const n=parseNum(text);
      $('#num').textContent=Number.isFinite(n)?n:'無法轉換';
      if(finalText)handleFinal(text,n);
    }
  };
  recognition.onerror=e=>{
    log('錯誤：'+e.error);
    setState('錯誤：'+e.error,'bad');
  };
  recognition.onend=()=>{
    if(running){
      setTimeout(()=>{try{recognition.start()}catch(e){}},250);
    }
  };
}
function handleFinal(text,n){
  attempts++;
  const want=current();
  const ok=Number.isFinite(n)&&n===want;
  const el=$('#t'+idx);
  el.classList.remove('pass','fail');
  el.classList.add(ok?'pass':'fail');
  if(ok)passes++;
  $('#raw').className='raw '+(ok?'ok':'bad');
  $('#num').className='num '+(ok?'ok':'bad');
  setState(ok?'✓ 正確':'✗ 目標 '+want+(Number.isFinite(n)?'，聽成 '+n:'，無法轉成數字'),ok?'ok':'bad');
  log(`目標 ${want}｜原始「${text}」｜${Number.isFinite(n)?'轉成 '+n:'無法轉換'}｜${ok?'PASS':'FAIL'}`);
  if(idx<cases.length-1){
    idx++;
    setTimeout(showPrompt,900);
  }else{
    setState(`完成：${passes}/${attempts} 正確`,passes===attempts?'ok':'bad');
    running=false;
    $('#start').disabled=false;$('#stop').disabled=true;
    try{recognition.stop()}catch(e){}
  }
}
async function start(){
  try{
    await setupMic();
    if(!recognition)buildRecognition();
    running=true;$('#start').disabled=true;$('#stop').disabled=false;
    showPrompt();
    try{recognition.start()}catch(e){}
  }catch(e){
    log(String(e.message||e));
    setState(String(e.message||e),'bad');
  }
}
function stop(){
  running=false;$('#start').disabled=false;$('#stop').disabled=true;
  setState('已停止');
  try{recognition?.stop()}catch(e){}
}
function reset(){
  stop();idx=0;attempts=0;passes=0;renderTests();showPrompt();
  $('#raw').textContent='—';$('#num').textContent='—';$('#log').textContent='';
}
$('#start').onclick=start;$('#stop').onclick=stop;$('#reset').onclick=reset;
$('#setCustom').onclick=()=>{
  const n=Number($('#custom').value);
  if(!Number.isFinite(n)||n<0||n>9999)return;
  cases.splice(0,cases.length,n);
  idx=0;attempts=0;passes=0;renderTests();showPrompt();
};
renderTests();showPrompt();
})();
</script>
</body>
</html>
