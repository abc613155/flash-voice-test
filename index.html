<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一年級 901｜閃算訓練</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#171717}
.app{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #d8dce3;border-radius:13px;padding:15px;margin-top:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title{font-size:23px;font-weight:900}
.sub,.hint{color:#6b7280;font-size:14px}
.stats{display:flex;gap:8px}
.pill{background:#fff;border:1px solid #d8dce3;border-radius:12px;padding:8px 11px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
select,input{width:100%;min-height:46px;border:1px solid #d8dce3;border-radius:10px;padding:8px;font-size:17px}
.stage{text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.status{align-self:stretch;display:flex;justify-content:space-between;color:#6b7280}
.flash{font-size:clamp(80px,20vw,150px);font-weight:900;min-height:160px;display:flex;align-items:center}.flash.pop{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:scale(1);opacity:1}}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button{min-height:46px;border:1px solid #d8dce3;border-radius:10px;background:#fff;padding:8px 13px;font-weight:800;font-size:15px}
button.primary{background:#2563eb;color:white;border-color:#2563eb}
button:disabled{opacity:.45}
.voice{margin-top:8px;font-size:18px;font-weight:900;min-height:28px}
.voice.ready{color:#15803d}.voice.listen{color:#2563eb}.voice.bad{color:#b91c1c}
.result{display:none;text-align:center}.result.show{display:block}.score{font-size:42px;font-weight:900}
body.practice .settings{display:none}
@media(max-width:600px){
 .settings{grid-template-columns:1fr}.top{display:block}.stats{margin-top:8px}
 .pill{flex:1;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr 1fr}.stage{min-height:220px}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div>
    <div class="sub">一年級組 901｜閃算訓練</div>
    <div class="title" id="modeTitle"></div>
    <div class="actions">
      <button type="button" class="primary" id="start" disabled>準備語音中…</button>
      <span id="buildTag" style="font-size:11px;color:#6b7280">v13.1</span>
      <button type="button" id="repeat" disabled>↻ 重播本題</button>
      <button type="button" id="reset">重新設定</button>
    </div>
  </div>
  <div class="stats">
    <div class="pill">第 <b id="qno">1</b>/<b id="qtotal">15</b> 題</div>
    <div class="pill">正確 <b id="correct">0</b></div>
  </div>
</header>

<section class="card settings">
  <div><label>訓練級別</label>
    <select id="level">
      <option value="10a">十級｜一位數 4口</option>
      <option value="10b">十級｜一位／二位數 3口</option>
      <option value="9a">九級｜一位數 5口</option>
      <option value="9b">九級｜一位／二位數 4口</option>
    </select>
  </div>
  <div><label>每口顯示時間：<b id="speedText">0.8 秒</b></label>
    <input id="speed" type="range" min=".1" max="1" step=".1" value=".8">
  </div>
  <div><label>題數</label>
    <select id="questions">
      <option value="15">15題｜正式訓練</option>
      <option value="30">30題｜同分加賽</option>
      <option value="10">10題｜快速練習</option>
    </select>
  </div>
  <div><label>數字間隔</label>
    <select id="gap">
      <option value="0">連續閃現</option>
      <option value="100">0.1秒</option>
      <option value="200">0.2秒</option>
    </select>
  </div>
</section>

<section class="card stage">
  <div class="status"><span id="status">準備開始</span><span>第 <b id="mouth">0</b>/<b id="mouthTotal">4</b> 口</span></div>
  <div class="flash" id="flashNumber">READY</div>
  <div class="voice" id="voiceState">語音引擎載入中…</div>
  <div class="hint">閃完後直接說答案，不用按任何按鈕</div>
</section>

<section class="card result" id="resultPanel">
  <div>本次成績</div>
  <div class="score"><span id="finalScore">0</span> / <span id="finalTotal">15</span></div>
  <div id="accuracy"></div>
</section>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s);
let terms=[],target=0,q=1,correct=0,busy=false,timers=[],voiceReady=false,started=false;

function cfg(){
  const v=$('#level').value;
  const m={
    '10a':['十級心算｜一位數 4 口',4,0],
    '10b':['十級心算｜一位／二位數 3 口',3,1],
    '9a':['九級心算｜一位數 5 口',5,0],
    '9b':['九級心算｜一位／二位數 4 口',4,1]
  }[v];
  return {name:m[0],mouths:m[1],mixed:m[2],total:+$('#questions').value,speed:+$('#speed').value*1000,gap:+$('#gap').value};
}
function later(f,t){timers.push(setTimeout(f,t))}
function clearTimers(){timers.forEach(clearTimeout);timers=[];busy=false}
function gen(){
  const c=cfg(); let a=[],sum=0;
  for(let i=0;i<c.mouths;i++){
    let max=c.mixed?99:9;
    let min=c.mixed&&Math.random()<.65?10:1;
    let n=min+Math.floor(Math.random()*(max-min+1));
    if(i&&Math.random()<.32&&sum-n>=0)n=-n;
    sum+=n;a.push(n);
  }
  terms=a;target=sum;$('#mouthTotal').textContent=c.mouths;
}
function head(){
  const c=cfg();
  $('#modeTitle').textContent=c.name;
  $('#qno').textContent=q;$('#qtotal').textContent=c.total;$('#correct').textContent=correct;
}
function voiceState(text,cls=''){
  const e=$('#voiceState'); e.className='voice '+cls; e.textContent=text;
}
function showAnswer(){
  busy=false;
  $('#flashNumber').textContent='?';
  $('#status').textContent='請回答';
  $('#repeat').disabled=false;
  voiceState('🎧 請直接說答案','listen');
  window.beginVoiceAnswer?.();
}
function flash(){
  clearTimers();
  busy=true;
  window.cancelVoiceAnswer?.();
  $('#repeat').disabled=true;
  const c=cfg();let i=0;
  $('#status').textContent='開始';
  $('#mouth').textContent='0';
  voiceState('');
  const step=()=>{
    if(i>=terms.length){later(showAnswer,Math.max(120,c.gap));return}
    const box=$('#flashNumber');
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    box.textContent=(terms[i]>0&&i>0?'+':'')+terms[i];
    $('#mouth').textContent=i+1;
    i++;
    const blank=Math.max(90,c.gap);
    later(()=>{box.textContent='';box.classList.remove('pop');later(step,blank)},c.speed);
  };
  step();
}
function judge(v,heard=''){
  if(busy || !started)return;
  window.cancelVoiceAnswer?.();
  const c=cfg(),ok=v===target;
  if(ok)correct++;
  $('#correct').textContent=correct;
  $('#status').textContent=ok?'答對':'答錯';
  $('#flashNumber').textContent=v;
  voiceState((heard?heard+' → ':'')+(ok?'✓ 正確':'✗ 正確答案 '+target),ok?'ready':'bad');
  if(q>=c.total){
    started=false;
    $('#resultPanel').classList.add('show');
    $('#finalScore').textContent=correct;
    $('#finalTotal').textContent=c.total;
    $('#accuracy').textContent='正確率 '+Math.round(correct/c.total*100)+'%';
    $('#status').textContent='完成';
    $('#repeat').disabled=true;
    return;
  }
  q++;head();gen();
  later(()=>flash(),750);
}
function reset(){
  clearTimers();window.cancelVoiceAnswer?.();
  started=false;q=1;correct=0;gen();head();
  document.body.classList.remove('practice');
  $('#resultPanel').classList.remove('show');
  $('#flashNumber').textContent='READY';$('#status').textContent='準備開始';$('#mouth').textContent='0';
  $('#repeat').disabled=true;
  voiceState(voiceReady?'語音已就緒':'語音引擎載入中…',voiceReady?'ready':'');
}
window.voiceEngineReady=()=>{
  voiceReady=true;
  $('#start').disabled=false;$('#start').textContent='▶ 開始';
  if(!started)voiceState('語音已就緒','ready');
};
window.voiceEngineError=msg=>{
  voiceReady=false;$('#start').disabled=true;$('#start').textContent='語音無法啟動';
  voiceState(msg||'語音引擎載入失敗','bad');
};
window.voiceHeardNumber=(n,heard)=>judge(n,heard);
window.voiceRetry=msg=>{ if(started&&!busy) voiceState(msg||'沒聽清楚，再說一次','listen') };

$('#start').onclick=async()=>{
  if(!voiceReady)return;
  $('#start').disabled=true;$('#start').textContent='開啟麥克風…';
  try{
    await window.prepareVoiceMic?.();
  }catch(e){
    $('#start').disabled=false;$('#start').textContent='▶ 開始';
    voiceState('請允許麥克風權限','bad');return;
  }
  started=true;q=1;correct=0;gen();head();
  document.body.classList.add('practice');
  $('#resultPanel').classList.remove('show');
  $('#start').textContent='進行中';
  flash();
};
$('#repeat').onclick=()=>{if(!busy&&started)flash()};
$('#reset').onclick=()=>{reset();if(voiceReady){$('#start').disabled=false;$('#start').textContent='▶ 開始'}};
$('#speed').oninput=()=>$('#speedText').textContent=(+$('#speed').value).toFixed(1)+' 秒';
$('#level').onchange=reset;$('#questions').onchange=reset;
reset();
})();
</script>

<script type="module">
import { initKWSModule, createKeywordSpotter } from "https://cdn.jsdelivr.net/npm/@sherpaw/kws@0.2.1/dist/core.js";

const MODEL="https://huggingface.co/moeru-ai/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01/resolve/main/install/bin/wasm/";
let moduleKws=null,spotter=null,stream=null,audioCtx=null,source=null,processor=null;
let listening=false,processing=false,speechSeen=false,silenceMs=0,lastLoudAt=0;

const py={
  '零':['l','íng'],'一':['y','ī'],'二':['èr'],'兩':['l','iǎng'],
  '三':['s','ān'],'四':['s','ì'],'五':['w','ǔ'],'六':['l','iù'],
  '七':['q','ī'],'八':['b','ā'],'九':['j','iǔ'],
  '十':['sh','í'],'百':['b','ǎi'],'千':['q','iān']
};

function zhNumber(n,useLiang=false){
  if(n===0)return '零';
  const d=['零','一','二','三','四','五','六','七','八','九'];
  if(n<10)return d[n];
  if(n<20)return '十'+(n%10?d[n%10]:'');
  if(n<100)return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');
  if(n<1000){
    let h=Math.floor(n/100),r=n%100;
    let head=(useLiang&&h===2?'兩':d[h])+'百';
    if(!r)return head;
    if(r<10)return head+'零'+d[r];
    if(r<20)return head+'一十'+(r%10?d[r%10]:'');
    return head+d[Math.floor(r/10)]+'十'+(r%10?d[r%10]:'');
  }
  let th=Math.floor(n/1000),r=n%1000;
  let head=(useLiang&&th===2?'兩':d[th])+'千';
  if(!r)return head;
  if(r<100)head+='零';
  return head+zhNumber(r,useLiang);
}
function toTokens(text){
  return [...text].flatMap(ch=>py[ch]||[]);
}
function variantsFor(n){
  const out=[zhNumber(n,false)];
  if(n>=200&&n<300)out.push(zhNumber(n,true));
  // Taiwan children may naturally say 一百十X instead of 一百一十X.
  if(n>=110&&n<120)out.push('一百十'+(n%10?zhNumber(n%10):''));
  return [...new Set(out)].map(t=>({tokens:toTokens(t),threshold:.25,score:1.5}));
}
const numberKeywords=Array.from({length:401},(_,n)=>({
  label:String(n),matches:variantsFor(n),threshold:.25,score:1.5
}));

function rms(a){
  let sum=0;for(let i=0;i<a.length;i++)sum+=a[i]*a[i];
  return Math.sqrt(sum/a.length);
}
function mountPack(mod,data,meta){
  const bytes=new Uint8Array(data);
  for(const f of meta.files){
    const name=f.filename.startsWith('/')?f.filename.slice(1):f.filename;
    try{if(mod.FS.analyzePath('/'+name).exists)mod.FS.unlink('/'+name)}catch(e){}
    mod.FS_createDataFile('/',name,bytes.subarray(f.start,f.end),true,true,true);
  }
}
function restartListening(message){
  if(!listening)return;
  speechSeen=false;silenceMs=0;lastLoudAt=0;
  try{spotter.reset()}catch(e){}
  window.voiceRetry(message||'沒聽清楚，再說一次');
}
async function loadVoice(){
  try{
    const [d,m]=await Promise.all([
      fetch(MODEL+'preload.data',{cache:'force-cache'}),
      fetch(MODEL+'preload.js.metadata',{cache:'force-cache'})
    ]);
    if(!d.ok||!m.ok)throw new Error('model');
    const [data,meta]=await Promise.all([d.arrayBuffer(),m.json()]);
    moduleKws=await initKWSModule();
    mountPack(moduleKws,data,meta);
    spotter=createKeywordSpotter(moduleKws,{
      model:{encoder:'encoder.onnx',decoder:'decoder.onnx',joiner:'joiner.onnx',tokens:'tokens.txt'},
      keywords:numberKeywords,maxActivePaths:8
    });
    window.voiceEngineReady();
  }catch(e){
    console.error(e);
    window.voiceEngineError('本機數字語音載入失敗，請重新整理頁面');
  }
}
window.prepareVoiceMic=async()=>{
  if(audioCtx&&stream)return;
  stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false
  });
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  source=audioCtx.createMediaStreamSource(stream);
  processor=audioCtx.createScriptProcessor(2048,1,1);
  source.connect(processor);processor.connect(audioCtx.destination);
  processor.onaudioprocess=e=>{
    if(!listening||!spotter||processing)return;
    const chunk=new Float32Array(e.inputBuffer.getChannelData(0));
    const level=rms(chunk);
    const chunkMs=chunk.length/audioCtx.sampleRate*1000;
    if(level>.014){
      speechSeen=true;silenceMs=0;lastLoudAt=performance.now();
    }else if(speechSeen){
      silenceMs+=chunkMs;
    }

    processing=true;
    try{
      const hits=spotter.processAudio(chunk,audioCtx.sampleRate);
      if(hits.length){
        const n=Number(hits[0].label);
        if(Number.isFinite(n)){
          listening=false;
          window.voiceHeardNumber(n,'聽到 '+n);
          return;
        }
      }
    }catch(err){console.error(err)}
    finally{processing=false}

    // Heard a voice but no complete number matched: reset after a short pause.
    if(listening&&speechSeen&&silenceMs>850){
      restartListening('沒聽清楚，請再說一次');
    }
  };
};
window.beginVoiceAnswer=()=>{
  if(!spotter)return;
  speechSeen=false;silenceMs=0;lastLoudAt=0;listening=true;
  try{spotter.reset()}catch(e){}
};
window.cancelVoiceAnswer=()=>{
  listening=false;speechSeen=false;silenceMs=0;lastLoudAt=0;
};
loadVoice();
</script>
</body>
</html>
