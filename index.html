<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中文數字語音訓練器</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.5.4/dist/speech-commands.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#111827}
main{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde2ea;border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:25px;margin:0 0 8px}.muted{color:#667085;line-height:1.6}.word{text-align:center;font-size:76px;font-weight:900;margin:20px 0}
button{width:100%;min-height:54px;border:0;border-radius:13px;font-size:18px;font-weight:800;margin-top:10px;background:#2563eb;color:#fff}
button.secondary{background:#475467}button:disabled{opacity:.45}.status{text-align:center;font-weight:800;margin:10px}.progress{height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:13px}
</style></head><body><main>
<h1>中文數字語音訓練器</h1>
<div class="muted">只需做一次。每個基本詞錄 8 次，每次按住按鈕後清楚說出畫面上的字。</div>
<div class="card">
 <div class="progress"><div id="bar" class="bar"></div></div>
 <div id="count" class="status">準備中…</div>
 <div id="word" class="word">—</div>
 <button id="rec" disabled>🎙 按一下錄這個詞</button>
 <div id="msg" class="status"></div>
</div>
<div class="card">
 <div class="grid"><button id="train" disabled>開始訓練模型</button><button id="test" class="secondary" disabled>測試辨識</button></div>
 <div id="trainMsg" class="status"></div>
 <button id="save" disabled>下載訓練資料</button>
</div>
<div class="muted small">詞彙：零、一、二、三、四、五、六、七、八、九、十、百、負、背景。訓練資料會留在目前瀏覽器；「下載訓練資料」可另存備份。</div>
</main>
<script>
const WORDS=['零','一','二','三','四','五','六','七','八','九','十','百','負','背景'], EACH=8;
let r, wi=0, rep=0, busy=false;
const $=s=>document.querySelector(s);
async function init(){
 try{
  $('#msg').textContent='載入輕量語音底模…';
  const base=speechCommands.create('BROWSER_FFT');
  await base.ensureModelLoaded();
  r=base.createTransfer('zh-num-'+Date.now());
 }catch(err){$('#msg').textContent='載入失敗：'+err.message;return}
 $('#rec').disabled=false; render();
}
function render(){
 $('#word').textContent=WORDS[wi]||'完成';
 $('#count').textContent=wi<WORDS.length?`${WORDS[wi]}：第 ${rep+1} / ${EACH} 次`:'錄音完成，可以訓練';
 const done=wi*EACH+rep, total=WORDS.length*EACH;
 $('#bar').style.width=(done/total*100)+'%';
 if(wi>=WORDS.length){$('#rec').disabled=true;$('#train').disabled=false}
}
$('#rec').onclick=async()=>{
 if(busy||wi>=WORDS.length)return;busy=true;$('#rec').disabled=true;$('#msg').textContent='🎙 請說「'+WORDS[wi]+'」';
 try{
  await r.collectExample(WORDS[wi]);
  rep++; if(rep>=EACH){rep=0;wi++}
  $('#msg').textContent='✓ 收到'; render();
 }catch(e){$('#msg').textContent='錄音錯誤：'+e.message}
 busy=false;if(wi<WORDS.length)$('#rec').disabled=false;
};
$('#train').onclick=async()=>{
 $('#train').disabled=true;$('#trainMsg').textContent='訓練中…';
 try{
  await r.train({epochs:35,callback:{onEpochEnd:async(e,logs)=>{$('#trainMsg').textContent=`訓練 ${e+1}/35｜accuracy ${(logs.acc*100||0).toFixed(0)}%`}}});
  $('#trainMsg').textContent='✓ 模型訓練完成';$('#test').disabled=false;$('#save').disabled=false;
 }catch(e){$('#trainMsg').textContent='訓練失敗：'+e.message;$('#train').disabled=false}
};
$('#test').onclick=async()=>{
 $('#trainMsg').textContent='🎙 說一個已訓練的基本詞…';
 await r.listen(res=>{
  const labels=r.wordLabels();let k=0;for(let i=1;i<res.scores.length;i++)if(res.scores[i]>res.scores[k])k=i;
  $('#trainMsg').textContent=`聽到：${labels[k]}｜信心 ${(res.scores[k]*100).toFixed(0)}%`;
  r.stopListening();
 },{probabilityThreshold:0.65,overlapFactor:0.25,invokeCallbackOnNoiseAndUnknown:false});
};
$('#save').onclick=async()=>{
 try{await r.serializeExamples().then(buf=>{
  const blob=new Blob([buf],{type:'application/octet-stream'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='中文數字訓練資料.bin';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 });}catch(e){$('#trainMsg').textContent='下載失敗：'+e.message}
};
init();
</script></body></html>
